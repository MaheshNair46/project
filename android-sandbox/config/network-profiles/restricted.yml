# Restricted Network Profile
# Highly restricted network for malware analysis

name: "Restricted Network"
description: "Restricted network with limited connectivity and monitoring"

type: "custom_bridge"
isolation: "strict"

# IP Configuration
ip:
  allocation: "static"
  range: "192.168.200.0/24"
  gateway: "192.168.200.1"
  dns_servers:
    - "1.1.1.1"
    - "9.9.9.9"
  ntp_servers:
    - "time.cloudflare.com"

# Network Interface Configuration
interfaces:
  primary:
    name: "eth0"
    enabled: true
    mtu: 1500
    ipv4:
      enabled: true
      dhcp: false
    ipv6:
      enabled: false

# Routing Configuration
routing:
  default_route: "192.168.200.1"
  custom_routes:
    - destination: "10.0.0.0/8"
      gateway: "192.168.200.1"
      description: "Route private networks"
    - destination: "172.16.0.0/12"
      gateway: "192.168.200.1"
      description: "Route private networks"
    - destination: "192.168.0.0/16"
      gateway: "192.168.200.1"
      description: "Route private networks"

# Proxy Configuration
proxy:
  enabled: true
  http_proxy: "http://proxy.internal:8080"
  https_proxy: "http://proxy.internal:8080"
  bypass_list: ["localhost", "127.0.0.1", "*.internal"]

# Firewall Rules
firewall:
  enabled: true
  default_policy: "DROP"
  rules:
    - action: "ACCEPT"
      protocol: "tcp"
      destination_port: [53]
      description: "Allow DNS TCP"
    - action: "ACCEPT"
      protocol: "udp"
      destination_port: [53]
      description: "Allow DNS UDP"
    - action: "ACCEPT"
      protocol: "tcp"
      destination_port: [80, 443]
      destination: ["malware-analysis-servers.internal"]
      description: "Allow analysis servers"
    - action: "ACCEPT"
      protocol: "tcp"
      source_port: [4444, 5555]
      description: "Allow analysis tools"
    - action: "DROP"
      protocol: "tcp"
      destination_port: [25, 587]
      description: "Block SMTP"
    - action: "DROP"
      protocol: "udp"
      destination_port: [1900]
      description: "Block UPnP"
    - action: "DROP"
      protocol: "tcp"
      destination_port: [22, 23, 21]
      description: "Block SSH/Telnet/FTP"

# Traffic Shaping
traffic_shaping:
  enabled: true
  bandwidth_limit_kbps: 500
  latency_ms: 100
  packet_loss_percent: 1

# DNS Configuration
dns:
  custom_hosts:
    "malicious-domain.com": "127.0.0.1"
    "c2-server.evil": "192.168.200.100"
  dns_over_https:
    enabled: true
    provider: "cloudflare"
  dnssec:
    enabled: true

# NAT Configuration
nat:
  enabled: true
  masquerade: true
  port_forwarding: []

# Monitoring
monitoring:
  packet_capture: true
  connection_tracking: true
  bandwidth_monitoring: true
  deep_packet_inspection: true

# Security Settings
security:
  arp_spoofing_protection: true
  ip_spoofing_protection: true
  mac_filtering: true
  allowed_macs: ["02:42:ac:11:00:02", "02:42:ac:11:00:03"]