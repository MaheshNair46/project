# Samsung Galaxy S21 Device Template
# Samsung Galaxy S21 running Android 11

name: "Samsung Galaxy S21"
manufacturer: "Samsung"
model: "SM-G991B"
android:
  version: "11"
  api_level: 30
  build_number: "RP1A.200720.012.G991BXXU3AUDA7"
  security_patch: "2021-10-01"
  google_apis: true
  play_store: false

hardware:
  screen:
    resolution: "1080x2400"
    density: 480
    size_inches: 6.2
  cpu:
    cores: 8
    architecture: "x86_64"
  ram_mb: 8192
  storage_gb: 256
  sensors:
    - "accelerometer"
    - "gyroscope"
    - "light"
    - "proximity"
    - "compass"
    - "gps"
    - "fingerprint"
    - "heart_rate"
