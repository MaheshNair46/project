# Stealth Mode Security Policy
# Security policy designed to evade detection during analysis

name: "Stealth Mode"
description: "Security policy optimized for stealth analysis and anti-detection"

# Device Security
device:
  selinux: "enforcing"  # Keep SELinux enforcing to appear normal
  verified_boot: true
  encryption: true
  screen_lock: true

  # App Installation
  allow_unknown_sources: false  # Appear normal
  allow_debug_apps: false
  install_from_adb: false

  # System Modifications
  system_app_modification: false
  framework_modification: false
  bootloader_unlocked: false

# Application Permissions
permissions:
  # Dangerous permissions (require user interaction)
  auto_grant: []
  runtime_auto_approve: false

# Network Security
network:
  # SSL/TLS
  trust_all_certificates: false
  disable_certificate_pinning: false
  allow_self_signed_certs: false

  # HTTP/HTTPS
  cleartext_traffic_permitted: false
  allow_http_traffic: false

  # Network Analysis
  enable_packet_capture: false  # Hidden analysis
  enable_ssl_unpinning: false

  # Proxy Configuration
  allow_system_proxy: false
  allow_app_proxy: false

# System Security Bypasses (Hidden)
security_bypasses:
  # SafetyNet/Play Integrity
  bypass_safetynet: true
  bypass_play_integrity: true

  # Root Detection
  hide_root: true  # Hide root presence
  disable_root_detection: true

  # Debugger Detection
  disable_debugger_detection: true
  allow_debugger_attach: true  # Hidden debugger

  # Emulator Detection
  disable_emulator_detection: true

  # Anti-Tampering
  disable_integrity_checks: true
  allow_code_modification: true

# Analysis Tools Configuration (Hidden)
analysis_tools:
  frida:
    enabled: true
    auto_start: false  # Manual start only
    scripts:
      - "stealth-ssl-unpinning.js"
      - "anti-detection-bypass.js"
      - "stealth-network-monitor.js"
    permissions:
      - "process-injection"
      - "memory-access"
      - "function-hooking"
    stealth_mode: true

  strace:
    enabled: true
    auto_start: false
    filter: "network,file,process"
    output_format: "minimal"
    stealth_mode: true

  tcpdump:
    enabled: true
    auto_start: false
    interfaces: ["eth0"]
    filters: "not port 22 and not port 53"
    stealth_mode: true

  logcat:
    enabled: true
    log_level: "info"  # Reduced logging
    filters: ["MainActivity", "NetworkActivity"]
    buffer_size: "1MB"

# Data Persistence
data_persistence:
  # App Data
  preserve_app_data: false  # Don't preserve to avoid detection
  backup_app_data: false
  auto_backup_interval: 0

  # System Data
  preserve_system_logs: false
  preserve_network_captures: true  # Hidden captures
  preserve_crash_dumps: false

  # Analysis Data
  preserve_analysis_results: true
  analysis_data_retention_days: 7  # Short retention
  hidden_storage: true

# Monitoring and Alerting (Hidden)
monitoring:
  # Real-time Monitoring
  process_monitoring: true
  network_monitoring: true
  file_system_monitoring: true
  system_call_monitoring: false  # Too obvious

  # Behavior Analysis
  suspicious_behavior_detection: false  # Disable to avoid alerts
  anomaly_detection: false

  # Alerts
  alerts_enabled: false
  alert_methods: []
  webhook_url: ""

# Access Control
access_control:
  # Remote Access
  adb_enabled: true
  adb_port: 5555
  allow_remote_adb: false  # No remote access

  # Shell Access
  shell_access: true
  allow_root_shell: true

  # File Access
  allow_system_file_access: true
  allow_app_file_access: true

# Backup and Recovery
backup:
  # Automatic Snapshots
  auto_snapshot: false

  # Manual Snapshot
  allow_manual_snapshot: true

  # Recovery Options
  allow_quick_reset: true
  allow_full_reset: true
  preserve_analysis_data_on_reset: true

# Anti-Detection Features
anti_detection:
  # Timing Randomization
  randomize_timing: true
  timing_variance_percent: 15

  # Process Obfuscation
  obfuscate_process_names: true
  hide_analysis_processes: true

  # Network Obfuscation
  randomize_packet_timing: true
  fake_background_traffic: true

  # System Behavior
  simulate_normal_usage: true
  random_user_interactions: true
  background_app_launches: true

# Device Fingerprinting Anti-Detection
fingerprinting:
  # Device Properties Randomization
  randomize_device_id: true
  randomize_imei: true
  randomize_android_id: true
  randomize_serial: true

  # Network Properties
  randomize_mac_address: true
  randomize_ip_fingerprint: true

  # Browser Properties
  randomize_user_agent: true
  randomize_browser_fingerprint: true

# Evasion Techniques
evasion:
  # Sandbox Detection
  sandbox_detection_evasion: true
  anti_vm_detection: true
  anti_analysis_detection: true

  # Debugger Evasion
  anti_debugging: true
  timing_checks: true
  integrity_checks: true

  # Hooking Detection Evasion
  anti_hooking_detection: true
  inline_hook_evasion: true

# Operational Security
opsec:
  # Clean Up
  auto_cleanup_logs: true
  auto_cleanup_temp_files: true
  zero_free_space: true

  # Evidence Protection
  encrypt_analysis_data: true
  secure_data_deletion: true

  # Time Synchronization
  sync_with_real_device: true
  realistic_boot_times: true